<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070b19" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Sistema Solar AR</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="ar-hud">
